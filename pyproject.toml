[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-agents"
version = "0.1.0"
description = "Run a GitHub-backed team of coding agents: plan, build, cross-review, merge."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
relay = "relay.cli:main"
relay-bridge = "relay.bridge:main"

[tool.setuptools]
packages = ["relay"]

[tool.setuptools.package-data]
relay = ["templates/*.md"]
